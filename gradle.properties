org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ---- 依赖下载的健壮性（2026-11-24 加）----
# CI runner 连 Maven Central 偶发失败，实测过一次：
#   > Could not download nativeruntime-dist-compat-1.0.16.jar
#     (org.robolectric:nativeruntime-dist-compat:1.0.16)
#   > Could not get resource 'https://repo.maven.apache.org/maven2/...'
# 该 artifact 在 Maven Central 确实存在（2024-10-22 发布），是网络问题。
#
# 这几个是 Gradle 内置的系统属性（不是插件），对 HTTP(S) 仓库生效：
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
