name: build-probe

# 只构建探针 APK；容器骨架（:app）用另一个 workflow。
#
# 触发：**只有 workflow_dispatch**（2026-11-24 改）。
# 用户要求「要触发编译的 CI 只能触发一次编译，明确指定是容器或者探针编译」。
# push 的 paths 过滤保证不了「只跑一个」—— 一次提交同时含 probe/** 和
# .github/workflows/container-build.yml 时两个 workflow 都会跑（已实际发生过）。
# 所以 push 自动触发全部移除，编译必须显式指定：
#   node tools/release/gh-api.mjs --dispatch probe-build.yml main

on:
  workflow_dispatch:
    inputs:
      abi:
        description: '目标 ABI'
        type: choice
        options: [arm64-v8a, x86_64, universal]
        default: arm64-v8a

permissions:
  contents: write

# 同一分支重复触发时取消旧任务，避免浪费私有仓库 Actions 额度
concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

env:
  # 自建 SDK 根，放在 runner 用户目录下，保证 cache 可读写
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  GRADLE_VERSION: '8.9'
  NDK_VERSION: '27.1.12297006'
  CMAKE_VERSION: '3.22.1'
  SDK_PLATFORM: 'android-35'
  BUILD_TOOLS: '35.0.0'

  # ★ 固定缓存键：只 bump 这个值才会让缓存整体失效
  # 必须与 container-build.yml 的 CACHE_EPOCH 一致，否则两个 workflow 各存一份 SDK/gradle
  # （实测：container=v2 / probe=v1 -> 两份 SDK 780+783MB、两份 gradle 177+692MB，白占 957MB）
  CACHE_EPOCH: 'v2'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROBE_ABI: ${{ inputs.abi || 'arm64-v8a' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 缓存 1：Android SDK 组件（固定 key） ----------
      - name: Cache Android SDK (fixed key)
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: .android-sdk
          key: sdk-${{ env.SDK_PLATFORM }}-bt${{ env.BUILD_TOOLS }}-ndk${{ env.NDK_VERSION }}-cmake${{ env.CMAKE_VERSION }}-${{ env.CACHE_EPOCH }}
          # 前缀回退：bump CACHE_EPOCH 后仍复用旧缓存。
          # 部分命中时 cache-hit=false，下面的安装步骤会自动补装差量，然后保存新 key。
          restore-keys: |
            sdk-${{ env.SDK_PLATFORM }}-bt${{ env.BUILD_TOOLS }}-ndk${{ env.NDK_VERSION }}-cmake${{ env.CMAKE_VERSION }}-

      - name: Install Android SDK components
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SDKMAN="$(ls -1 /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -z "${SDKMAN:-}" ] || [ ! -x "$SDKMAN" ]; then
            SDKMAN="$(command -v sdkmanager || true)"
          fi
          if [ -z "${SDKMAN:-}" ]; then
            echo "::error::sdkmanager not found on runner"; exit 1
          fi
          echo "using sdkmanager: $SDKMAN"
          mkdir -p "$ANDROID_SDK_ROOT"
          yes | "$SDKMAN" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMAN" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platforms;${SDK_PLATFORM}" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          du -sh "$ANDROID_SDK_ROOT" || true

      # ---------- JDK ----------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------- 缓存 2：Gradle home（固定 key） ----------
      - name: Cache Gradle home (fixed key)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-home-${{ env.GRADLE_VERSION }}-${{ env.CACHE_EPOCH }}

      # ---------- 固定 debug keystore（与容器同一套，保证 adb install -r 可覆盖） ----------
      # 背景：探针之前完全没有签名处理，每次构建 AGP 现场生成新 keystore ->
      #       adb install -r 报 INSTALL_FAILED_UPDATE_INCOMPATIBLE。
      # 做法与 container-build.yml 一致（参考 C:\Users\86177\Desktop\阅读器开发）：
      #   1) keystore 放 $GITHUB_WORKSPACE/debug.keystore（绝对路径可控）
      #   2) 通过环境变量传给 probe/build.gradle.kts 的显式 signingConfigs
      #   3) 缺 Secret 直接 ::error:: 失败
      - name: Install fixed debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 未配置 —— 拒绝构建（探针签名会漂移）"
            exit 1
          fi
          KS_PATH="$GITHUB_WORKSPACE/debug.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$KS_PATH"
          chmod 600 "$KS_PATH"
          echo "keystore written: $KS_PATH ($(wc -c < "$KS_PATH") bytes)"
          keytool -list -v -keystore "$KS_PATH" \
            -storepass android -alias androiddebugkey 2>/dev/null \
            | grep -E "Owner:|SHA256:" || true

      - name: Build probe APK
        env:
          STORE_FILE_NAME: ${{ github.workspace }}/debug.keystore
          KEYSTORE_PASSWORD: android
          STORE_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: |
          echo "ABI=$PROBE_ABI"
          # 用 wrapper 构建：Gradle 发行版落在 ~/.gradle/wrapper/dists（已纳入固定 key 缓存）
          chmod +x ./gradlew
          ./gradlew :probe:assembleDebug -PprobeAbi="$PROBE_ABI" --no-daemon --stacktrace

      # 构建后校验签名，与容器 workflow 同款
      - name: Verify APK signature matches keystore
        run: |
          set -euo pipefail
          KS_PATH="$GITHUB_WORKSPACE/debug.keystore"
          APK=$(find probe/build/outputs/apk -name '*.apk' | head -1)
          echo "APK=$APK"
          # 两个工具的输出格式不同：keytool 带冒号（60:AD:A6:...），
          # apksigner 不带冒号（60ADA69E...）。必须归一化后再比，否则必然误报漂移。
          KS_FP=$(keytool -list -v -keystore "$KS_PATH" -storepass android -alias androiddebugkey 2>/dev/null \
                    | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'a-f' 'A-F')
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner 未找到，跳过签名校验"
            exit 0
          fi
          APK_FP=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null \
                    | grep -i 'SHA-256 digest' | head -1 | sed 's/.*: *//' | tr -d ':' | tr 'a-f' 'A-F')
          echo "keystore=$KS_FP"
          echo "apk     =$APK_FP"
          if [ "$KS_FP" != "$APK_FP" ]; then
            echo "::error::探针签名漂移！keystore=$KS_FP apk=$APK_FP"
            exit 1
          fi
          echo "::notice::探针签名一致（install -r 可用）"

      # 产物体面化：不要 app-debug.apk 这种通用名，也不要在 artifact 里带多级目录
      - name: Stage artifact
        id: stage
        run: |
          set -euo pipefail
          SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          mkdir -p out
          SRC="$(ls probe/build/outputs/apk/debug/*.apk | head -n1)"
          DST="out/probe-${SHA}-${PROBE_ABI}.apk"
          cp "$SRC" "$DST"
          # 产物约定：文件名必须 .apk 结尾
          case "$DST" in
            *.apk) ;;
            *) echo "::error::artifact must end with .apk: $DST"; exit 1 ;;
          esac
          echo "path=$DST" >> "$GITHUB_OUTPUT"
          ls -lh out
          echo "=== native libs (16KB 对齐检查) ==="
          find probe/build -name 'libprobe.so' -exec ls -lh {} \; || true

      # 不使用 upload-artifact：GitHub 会把产物强制打成 zip。
      # 挂到 Release 后，下载链接就是 .apk 文件本身（无 zip、无目录层级）。
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK (latest)
          body: "probe APK built from ${{ github.sha }}"
          prerelease: true
          overwrite_files: true
          files: out/*.apk

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: probe-build-reports
          path: |
            probe/build/reports/**
            probe/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
