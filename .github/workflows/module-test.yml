name: module-test

# 模块级单元测试（2026-11-24 新增，用户要求）。
#
# 目的：**每个拆分出的小模块都能独立测试**，不依赖整体能运行。
# 只跑 JVM 单测（不构建 APK、不需要设备），因此比 container-build 快得多。
#
# 触发：只有 workflow_dispatch（与其它编译 workflow 一致：一次一个，明确指定）
#   node tools/release/gh-api.mjs --dispatch module-test.yml main
#
# 约定：**拆出新模块时，同一个提交里加一个 <Module>Test.kt**；
#       并把模块名加到下面的默认 modules 列表里。

on:
  workflow_dispatch:
    inputs:
      repo:
        description: '容器源码仓库'
        default: 'wentureing/ShitJumpingVM'
      ref:
        description: '分支 / tag / SHA'
        default: 'main'
      modules:
        description: '要测试的 Gradle 模块（空格分隔）'
        default: ':core:common :core:virtualization :core:hook :core:sandbox'
      test_filter:
        description: '可选：只跑匹配的测试类（Gradle --tests 语法；建议只配一个 module）'
        default: ''

permissions:
  contents: read
  checks: write          # dorny/test-reporter 需要创建 check run

concurrency:
  group: module-test-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  SDK_PLATFORM: 'android-35'
  BUILD_TOOLS: '35.0.0'
  NDK_VERSION: '27.1.12297006'
  CMAKE_VERSION: '3.22.1'
  # 与 container-build / probe-build 保持一致，便于复用同一份 Gradle 缓存
  GRADLE_VERSION: '8.9'
  # Robolectric 运行时按 SDK 下载 android-all-instrumented jar（约 100MB/个），
  # 不经过 Gradle 依赖解析，缓存在 ~/.m2/repository —— 必须单独缓存，否则每次都下。
  ROBOLECTRIC_VERSION: '4.14'
  CACHE_EPOCH: 'v2'

jobs:
  # 纯 C++ 逻辑的 host 向量测试（不需要 Android SDK/NDK，ubuntu runner 自带 g++）。
  # **与 module-test 并行**：不阻塞、也不干扰 Java/Kotlin 单测。
  # 设计见 docs/架构/架构-C++测试夹具设计.md（S1：抽纯逻辑 + 共用 golden 向量）
  cpp-core-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout container source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo || 'wentureing/ShitJumpingVM' }}
          ref: ${{ inputs.ref || 'main' }}
          path: container
          persist-credentials: false
          fetch-depth: 1

      - name: Compile pure C++ core (host)
        working-directory: container
        run: |
          set -euo pipefail
          g++ --version | head -n1
          g++ -std=c++17 -Wall -Wextra -Werror=return-type -O1 \
            -I core/hook/src/main/cpp/core \
            core/hook/src/main/cpp/core/path_rules.cpp \
            core/hook/src/test/cpp/path_rules_test.cpp \
            -o /tmp/path_rules_test

      - name: Run golden vectors (shared with Kotlin)
        working-directory: container
        run: |
          set -euo pipefail
          /tmp/path_rules_test core/hook/src/test/resources/golden/path_vectors.tsv

  module-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # 模块级并行：每个模块一个 job，互不连坐，墙钟不再叠加。
      # 用户 2026-11-25：#42/#44 单 job 串行跑到 8 分钟，要求拆分。
      matrix:
        # 2026-11-26：补 :core:common —— 日志/诊断相关的单测（DiagChannel / DiagOutput /
        # CheckResult / DiagnosticsRouter）全在这个模块，之前不在 matrix 里，
        # 传 modules=":core:common" 只会让三个 job 的测试步骤全部 skip 而**假绿**。
        module: [":core:common", ":core:virtualization", ":core:hook", ":core:sandbox"]

    steps:
      - name: Checkout container source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo || 'wentureing/ShitJumpingVM' }}
          ref: ${{ inputs.ref || 'main' }}
          path: container
          persist-credentials: false
          fetch-depth: 1

      - name: Show target modules
        run: |
          echo "repo=${{ inputs.repo || 'wentureing/ShitJumpingVM' }}"
          echo "ref=${{ inputs.ref || 'main' }}"
          echo "modules=${{ inputs.modules || ':core:virtualization :core:sandbox' }}"
          echo "matrix.module=${{ matrix.module }}"

      # 日志通道契约检查（毫秒级，不需要 SDK）：放在测试之前，早了断。
      # 只跑一个 job，其它 matrix 分支跳过，避免 4 份重复。
      - name: Checkout lint tools (sensor repo)
        if: matrix.module == ':core:common'
        uses: actions/checkout@v4
        with:
          repository: wentureing/sandboxsensor
          ref: main
          path: sensor
          persist-credentials: false
          fetch-depth: 1

      - name: Diag channel contract (DiagFiles vs native kMarkers)
        if: matrix.module == ':core:common'
        working-directory: container
        run: node ../sensor/tools/lint/check-diag-channels.mjs .

      # SDK 缓存与 container-build 共用同一套 key（避免重复下载 ~780MB）
      - name: Cache Android SDK (shared with container build)
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: .android-sdk
          key: sdk-${{ env.SDK_PLATFORM }}-bt${{ env.BUILD_TOOLS }}-ndk${{ env.NDK_VERSION }}-cmake${{ env.CMAKE_VERSION }}-${{ env.CACHE_EPOCH }}
          restore-keys: |
            sdk-${{ env.SDK_PLATFORM }}-bt${{ env.BUILD_TOOLS }}-ndk${{ env.NDK_VERSION }}-cmake${{ env.CMAKE_VERSION }}-

      - name: Install Android SDK components
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SDKMAN="$(ls -1 /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -z "${SDKMAN:-}" ] || [ ! -x "$SDKMAN" ]; then
            SDKMAN="$(command -v sdkmanager || true)"
          fi
          if [ -z "${SDKMAN:-}" ]; then
            echo "::error::sdkmanager not found on runner"; exit 1
          fi
          mkdir -p "$ANDROID_SDK_ROOT"
          yes | "$SDKMAN" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMAN" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platforms;${SDK_PLATFORM}" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          # path 必须与 container-build / probe-build **完全一致**。
          # actions/cache 的 cache version = hash(path + 压缩方式)：
          # path 不同 -> version 不同 -> 即使 key 存在也匹配不到（restore-keys 也跨不过去）。
          # 踩过：这里原先写 `~/.gradle/wrapper`（别的 workflow 用 `~/.gradle/wrapper/dists`），
          # 导致 restore-keys 里的 gradle-home-8.9-v2（691MB，确实存在）永远 miss。
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          # key 里必须用 ${{ runner.os }} 表达式（不能写 ${Runner.OS} 这种 shell 语法）。
          key: gradle-home-${{ env.GRADLE_VERSION }}-libs-${{ hashFiles('container/gradle/libs.versions.toml') }}-${{ env.CACHE_EPOCH }}
          restore-keys: |
            gradle-home-${{ env.GRADLE_VERSION }}-libs-${{ env.CACHE_EPOCH }}-
            gradle-home-${{ env.GRADLE_VERSION }}-${{ env.CACHE_EPOCH }}
            gradle-home-${{ env.GRADLE_VERSION }}-

      # Robolectric 的 android-all-instrumented jar 不走 Gradle 依赖解析，
      # 由 Robolectric 自己的 Maven 客户端下到 ~/.m2/repository。
      # 不缓存的话，每个用到 Robolectric 的模块首次跑测试都要重下 ~100MB/SDK。
      - name: Cache Robolectric runtime jars
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/org/robolectric
          key: robolectric-${{ env.ROBOLECTRIC_VERSION }}-${{ env.CACHE_EPOCH }}
          restore-keys: |
            robolectric-${{ env.ROBOLECTRIC_VERSION }}-

      - name: Diagnose test sources and compiled classes
        if: always()
        working-directory: container
        run: |
          MODULE="${{ matrix.module }}"
          MOD_DIR=$(echo "${MODULE}" | sed 's|^:||; s|:|/|g')
          echo "===== module: ${MODULE} (dir=${MOD_DIR}) ====="
          echo '===== test sources ====='
          find "${MOD_DIR}/src/test" -name '*.kt' -print 2>/dev/null | head -30 || true
          echo '===== test-results ====='
          ls -la "${MOD_DIR}/build/test-results/testDebugUnitTest" 2>/dev/null || echo '(none yet)'
      - name: Run module unit tests
        # matrix 展开后每个 job 只跑自己那个模块；inputs.modules 用于显式指定子集。
        if: ${{ inputs.modules == '' || contains(inputs.modules, matrix.module) }}
        working-directory: container
        run: |
          set -euo pipefail
          chmod +x gradlew
          MODULE="${{ matrix.module }}"
          FILTER="${{ inputs.test_filter || '' }}"
          echo "Running: ${MODULE}:testDebugUnitTest filter='${FILTER}'"
          if [ -n "$FILTER" ]; then
            ./gradlew --no-daemon --stacktrace "${MODULE}:testDebugUnitTest" \
              --tests "$FILTER" -DfailOnNoMatchingTests=false
          else
            ./gradlew --no-daemon --stacktrace "${MODULE}:testDebugUnitTest"
          fi

      # 假绿守卫：2026-11-26 实测 run 45737628896 —— 传 modules=":core:common" 时
      # 三个 job 的测试步骤全被 skip，job 仍绿，等于什么都没验证。
      # 这里直接数测试 XML 的 tests= 总和，0 就失败。
      - name: Assert tests actually ran
        # 只在"本 job 真的该跑测试"时校验（否则显式指定 modules 会让其它 job 误报红）。
        if: ${{ always() && (inputs.modules == '' || contains(inputs.modules, matrix.module)) }}
        working-directory: container
        run: |
          set -euo pipefail
          MOD_DIR=$(echo "${{ matrix.module }}" | sed 's|^:||; s|:|/|g')
          XML_DIR="${MOD_DIR}/build/test-results/testDebugUnitTest"
          if [ ! -d "$XML_DIR" ]; then
            echo "::error::没有测试结果目录：${XML_DIR}（模块没跑测试）"; exit 1
          fi
          total=$(grep -ho 'tests="[0-9]*"' -r "$XML_DIR" --include='*.xml' 2>/dev/null \
            | sed 's/[^0-9]//g' | awk '{s+=$1} END {print s+0}')
          classes=$(ls -1 "$XML_DIR"/*.xml 2>/dev/null | wc -l)
          echo "module=${{ matrix.module }} testClasses=$classes tests=$total"
          if [ "${total:-0}" -eq 0 ]; then
            echo "::error::${{ matrix.module }} 一个测试都没跑（filter 不匹配或测试被 skip）"; exit 1
          fi

      # 诊断序列模板（DiagnosticsSequenceOutputTest 写到 build/diagnostics/）
      - name: Show diagnostics sequence
        if: always() && matrix.module == ':core:common'
        working-directory: container
        run: |
          if [ -f core/common/build/diagnostics/checks-template.txt ]; then
            echo "===== DIAGNOSTICS SEQUENCE ====="
            cat core/common/build/diagnostics/checks-template.txt
            echo "===== END ====="
          else
            echo "::warning::core:common 跑过但没有 checks-template.txt（DiagnosticsSequenceOutputTest 没执行？）"
          fi
      - name: Publish test report
        if: always()
        # 报告步骤失败不应该让整个 job 变红（测试本身的失败由上面的 gradlew 步骤决定）。
        # 踩过：dorny/test-reporter 内部要跑 `git ls-files`，而这里 checkout 的是
        # 容器源码到 container/ 子目录，工作目录本身不是 git 仓库 -> git exit 128。
        continue-on-error: true
        uses: dorny/test-reporter@v1
        with:
          name: module-tests
          path: 'container/**/build/test-results/testDebugUnitTest/*.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
          # 在容器仓库里执行，让 reporter 的 git 操作有仓库可用
          working-directory: container

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-test-results
          path: 'container/**/build/reports/tests/testDebugUnitTest/**'
          if-no-files-found: ignore
