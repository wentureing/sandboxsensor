name: build-container

# 构建容器骨架（ShitJumpingVM fork），产出 debug APK 用于 T2 对照组。
# 不修改 ShitJumpingVM 仓库：由本仓库 checkout 其源码后构建。
#
# 触发：**只有 workflow_dispatch**（2026-11-24 改）。
# 用户要求「要触发编译的 CI 只能触发一次编译，明确指定是容器或者探针编译」。
# 一次一个，显式指定：
#   node tools/release/gh-api.mjs --dispatch container-build.yml main

on:
  workflow_dispatch:
    inputs:
      repo:
        description: '容器源码仓库'
        default: 'wentureing/ShitJumpingVM'
      ref:
        description: '分支 / tag / SHA'
        default: 'main'
      task:
        description: 'Gradle 任务'
        default: ':app:assembleDebug'

permissions:
  contents: write
  checks: write          # dorny/test-reporter 需要创建 check run

# 触发说明：本 workflow 只在自身文件变化或手动 dispatch 时运行。
# 改完 ShitJumpingVM 后，在此做一个无副作用改动即可触发重建。
# patch-level: p29（修豁免越权：access W_OK / fopen r+）

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  NDK_VERSION: '27.1.12297006'
  CMAKE_VERSION: '3.22.1'
  SDK_PLATFORM: 'android-35'
  BUILD_TOOLS: '35.0.0'

  # 与 probe-build.yml 共享同一套固定 key：SDK 缓存可直接复用（~780MB 不必重下）
  GRADLE_VERSION: '8.9'
  CACHE_EPOCH: 'v2'

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout container source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo || 'wentureing/ShitJumpingVM' }}
          ref: ${{ inputs.ref || 'main' }}
          path: container
          persist-credentials: false
          fetch-depth: 1

      - name: Show container revision
        working-directory: container
        run: |
          echo "repo=${{ inputs.repo || 'wentureing/ShitJumpingVM' }}"
          echo "ref=${{ inputs.ref || 'main' }}"
          git log --oneline -1 || true
          echo "--- modules ---"
          grep -E '^\s*include' settings.gradle.kts || true
          echo "--- ndk/cmake ---"
          grep -rE 'ndkVersion|cmake' --include='*.kts' . | head -n 20 || true

      - name: Cache Android SDK (fixed key, shared with probe)
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: .android-sdk
          key: sdk-${{ env.SDK_PLATFORM }}-bt${{ env.BUILD_TOOLS }}-ndk${{ env.NDK_VERSION }}-cmake${{ env.CMAKE_VERSION }}-${{ env.CACHE_EPOCH }}
          restore-keys: |
            sdk-${{ env.SDK_PLATFORM }}-bt${{ env.BUILD_TOOLS }}-ndk${{ env.NDK_VERSION }}-cmake${{ env.CMAKE_VERSION }}-

      - name: Install Android SDK components
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SDKMAN="$(ls -1 /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -z "${SDKMAN:-}" ] || [ ! -x "$SDKMAN" ]; then
            SDKMAN="$(command -v sdkmanager || true)"
          fi
          if [ -z "${SDKMAN:-}" ]; then
            echo "::error::sdkmanager not found on runner"; exit 1
          fi
          mkdir -p "$ANDROID_SDK_ROOT"
          yes | "$SDKMAN" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMAN" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platforms;${SDK_PLATFORM}" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle home (fixed key, shared with probe)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-home-${{ env.GRADLE_VERSION }}-${{ env.CACHE_EPOCH }}

      # 固定 debug keystore：否则每次构建都重新生成签名，
      # adb install -r 会报 INSTALL_FAILED_UPDATE_INCOMPATIBLE（必须卸载重装，沙箱数据全丢）。
      #
      # 2026-11-24 重做（参考 C:\Users\86177\Desktop\阅读器开发 的做法）：
      #   之前把 keystore 写到 "$HOME/.android/debug.keystore"，指望 AGP 的默认 debug 签名去读。
      #   实测失败：三个 APK 的证书 SHA256 全不同，有效期起点就是构建时刻，说明 AGP 每次
      #   都现场新建了 keystore —— 因为 AGP 用的是 System.getProperty("user.home")，
      #   与 shell 的 $HOME 在 CI 里可能不一致，写进去的文件根本没被读到。
      #
      #   现在的做法：
      #     1) keystore 放到 $GITHUB_WORKSPACE/debug.keystore（工作区内，路径绝对可控）
      #     2) 通过 STORE_FILE_NAME / KEYSTORE_PASSWORD / STORE_ALIAS / KEY_PASSWORD
      #        环境变量传给 app/build.gradle.kts，由它显式声明 signingConfigs
      #     3) 缺 Secret 时 ::error:: 直接失败，不再静默产出漂移签名的包
      - name: Install fixed debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 未配置 —— 拒绝构建（否则签名会漂移，install -r 必失败）"
            exit 1
          fi
          KS_PATH="$GITHUB_WORKSPACE/debug.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$KS_PATH"
          chmod 600 "$KS_PATH"
          echo "keystore written: $KS_PATH ($(wc -c < "$KS_PATH") bytes)"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "HOME=$HOME"
          echo "user.home(gradle JVM)=$(java -XshowSettings:properties -version 2>&1 | grep -i 'user.home' || true)"
          # 打印证书指纹，便于跨构建比对（不泄露私钥）
          keytool -list -v -keystore "$KS_PATH" \
            -storepass android -alias androiddebugkey 2>/dev/null \
            | grep -E "Owner:|SHA256:" || true

      - name: Build container APK
        working-directory: container
        env:
          # 传给 app/build.gradle.kts 的显式 signingConfigs（绝对路径，不依赖 AGP 推断）
          STORE_FILE_NAME: ${{ github.workspace }}/debug.keystore
          KEYSTORE_PASSWORD: android
          STORE_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ inputs.task || ':app:assembleDebug' }} --no-daemon --stacktrace

      # 构建后校验：APK 的签名证书必须与注入的 keystore 一致。
      # 这一步是"结构上不可能漂移"的保证 —— 参考阅读器开发的
      # "Require release keystore" 思路，用失败而不是警告。
      - name: Verify APK signature matches keystore
        run: |
          set -euo pipefail
          KS_PATH="$GITHUB_WORKSPACE/debug.keystore"
          APK=$(find container/app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK=$APK"
          # 两个工具的输出格式不同：keytool 带冒号（60:AD:A6:...），
          # apksigner 不带冒号（60ADA69E...）。必须归一化后再比，否则必然误报漂移。
          KS_FP=$(keytool -list -v -keystore "$KS_PATH" -storepass android -alias androiddebugkey 2>/dev/null \
                    | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'a-f' 'A-F')
          echo "keystore SHA256 = $KS_FP"
          # 用 apksigner（build-tools 自带）读 APK 签名
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner 未找到，跳过 APK 签名校验"
            exit 0
          fi
          APK_FP=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null \
                    | grep -i 'SHA-256 digest' | head -1 | sed 's/.*: *//' | tr -d ':' | tr 'a-f' 'A-F')
          echo "APK SHA256      = $APK_FP"
          if [ "$KS_FP" != "$APK_FP" ]; then
            echo "::error::签名漂移！keystore=$KS_FP APK=$APK_FP"
            exit 1
          fi
          echo "::notice::签名一致，install -r 可用"

      # P1-2：Robolectric 单元测试（纯 JVM，不需要模拟器）
      # P1-2：纯 JUnit 单测（零下载，秒级）。
      # 失败时**必须让 job 变红**（不再 continue-on-error）——
      # p23 曾出现「19 个用例全失败，job 仍显示绿色通过」的误判。
      #
      # 2026-11-24 恢复（此前为加快 WebView 调查临时 if: false）。
      # 分工约定：
      #   - 本步骤只跑 :core:sandbox 的快速单测（约 10-20s），作为「构建门禁」；
      #   - 全模块单测（含 :core:virtualization 等）由独立 workflow
      #     `module-test.yml` 负责，两者**互不干扰**（不同 workflow / 不同 concurrency group）。
      - name: Unit tests
        working-directory: container
        run: |
          set -o pipefail
          set +e
          ./gradlew :core:sandbox:testDebugUnitTest --no-daemon > /tmp/unit.log 2>&1
          rc=$?
          # 依赖下载偶发失败时重试一次。实测过 CI #46：
          #   > Could not download nativeruntime-dist-compat-1.0.16.jar
          #     (org.robolectric:nativeruntime-dist-compat:1.0.16)
          #   > Could not get resource 'https://repo.maven.apache.org/maven2/...'
          # 该 artifact 在 Maven Central 确实存在（2024-10-22 发布），是网络问题。
          # gradle.properties 里已配 http 超时 + repository max.retries=6，
          # 这里再加一层进程级重试，覆盖 Gradle 内置重试也放弃的情况。
          if [ $rc -ne 0 ] && grep -qE "Could not download|Could not get resource|Connection timed out|Read timed out" /tmp/unit.log; then
            echo "::warning::依赖下载失败，15s 后重试一次"
            sleep 15
            ./gradlew :core:sandbox:testDebugUnitTest --no-daemon > /tmp/unit.log 2>&1
            rc=$?
          fi
          set -e
          echo "=== 任务/结果摘要 ==="
          grep -E "^> Task :core:sandbox:test|FAILED|BUILD |tests? completed|error:" /tmp/unit.log | head -n 40 || echo "none"
          echo "=== 失败行（仅错误摘要）==="
          grep -E "FAILED|AssertionError|Caused by:|Exception|error:|Could not download" /tmp/unit.log | head -n 20 || echo "none"
          echo "=== 末尾 15 行 ==="
          tail -n 15 /tmp/unit.log
          exit $rc

      # 测试报告：JUnit XML -> GitHub check run + job summary，直接在 Actions 页面看，
      # 不需要下载 artifact。
      #
      # 用 mikepenz/action-junit-report 而不是 dorny/test-reporter：
      # 后者需要在一个 git 仓库根目录运行（它执行 `git ls-files`），
      # 而本 workflow 用 `actions/checkout` 的 `path: container` 把仓库检到子目录，
      # 根目录没有 .git -> p25 报 "fatal: not a git repository"。
      # 本 action 纯解析 XML，不依赖 git。
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'container/core/sandbox/build/test-results/testDebugUnitTest/*.xml'
          check_name: Unit Test Results
          fail_on_failure: true        # 有失败 -> check 标红且步骤失败
          require_tests: false         # 没跑测试不算失败
          detailed_summary: true       # 在 job summary 里列出每个用例
          job_summary: true
          include_passed: true

      - name: Collect outputs
        if: always()
        run: |
          echo "=== APK ==="
          find container -name '*.apk' -exec ls -lh {} \; 2>/dev/null || echo "no apk"
          echo "=== native libs ==="
          find container -name '*.so' -exec ls -lh {} \; 2>/dev/null | head -n 20 || true

      # 产物体面化：container-<repo>-<sha>.apk，artifact 内不带多级目录
      - name: Stage artifact
        id: stage
        run: |
          set -euo pipefail
          SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          mkdir -p out
          SRC="$(find container -path '*/build/outputs/apk/debug/*.apk' | head -n1 || true)"
          if [ -n "${SRC:-}" ]; then
            cp "$SRC" "out/container-shitjumpingvm-${SHA}.apk"
            # 产物约定：文件名必须 .apk 结尾
            DST="out/container-shitjumpingvm-${SHA}.apk"
            case "$DST" in
              *.apk) ;;
              *) echo "::error::artifact must end with .apk: $DST"; exit 1 ;;
            esac
            echo "path=out/container-shitjumpingvm-${SHA}.apk" >> "$GITHUB_OUTPUT"
            ls -lh out
          else
            echo "::warning::no apk produced"
          fi

      # 不使用 upload-artifact（强制 zip）；直接挂 Release asset。
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK (latest)
          body: "container APK built from ${{ github.sha }}"
          prerelease: true
          overwrite_files: true
          files: out/*.apk

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-build-reports
          path: |
            container/**/build/reports/**
            container/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
