name: build-container

# 构建容器骨架（ShitJumpingVM fork），产出 debug APK 用于 T2 对照组。
# 不修改 ShitJumpingVM 仓库：由本仓库 checkout 其源码后构建。

on:
  workflow_dispatch:
    inputs:
      repo:
        description: '容器源码仓库'
        default: 'wentureing/ShitJumpingVM'
      ref:
        description: '分支 / tag / SHA'
        default: 'main'
      task:
        description: 'Gradle 任务'
        default: ':app:assembleDebug'
  push:
    branches: [main]
    paths:
      - '.github/workflows/container-build.yml'

permissions:
  contents: write
  checks: write          # dorny/test-reporter 需要创建 check run

# 触发说明：本 workflow 只在自身文件变化或手动 dispatch 时运行。
# 改完 ShitJumpingVM 后，在此做一个无副作用改动即可触发重建。
# patch-level: p27（CAT_OUT 分块 2KB）

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  NDK_VERSION: '27.1.12297006'
  CMAKE_VERSION: '3.22.1'
  SDK_PLATFORM: 'android-35'
  BUILD_TOOLS: '35.0.0'

  # 与 probe-build.yml 共享同一套固定 key：SDK 缓存可直接复用（~780MB 不必重下）
  CACHE_EPOCH: 'v2'

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout container source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo || 'wentureing/ShitJumpingVM' }}
          ref: ${{ inputs.ref || 'main' }}
          path: container
          persist-credentials: false
          fetch-depth: 1

      - name: Show container revision
        working-directory: container
        run: |
          echo "repo=${{ inputs.repo || 'wentureing/ShitJumpingVM' }}"
          echo "ref=${{ inputs.ref || 'main' }}"
          git log --oneline -1 || true
          echo "--- modules ---"
          grep -E '^\s*include' settings.gradle.kts || true
          echo "--- ndk/cmake ---"
          grep -rE 'ndkVersion|cmake' --include='*.kts' . | head -n 20 || true

      - name: Cache Android SDK (fixed key, shared with probe)
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: .android-sdk
          key: sdk-${{ env.SDK_PLATFORM }}-bt${{ env.BUILD_TOOLS }}-ndk${{ env.NDK_VERSION }}-cmake${{ env.CMAKE_VERSION }}-${{ env.CACHE_EPOCH }}
          restore-keys: |
            sdk-${{ env.SDK_PLATFORM }}-bt${{ env.BUILD_TOOLS }}-ndk${{ env.NDK_VERSION }}-cmake${{ env.CMAKE_VERSION }}-

      - name: Install Android SDK components
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SDKMAN="$(ls -1 /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -z "${SDKMAN:-}" ] || [ ! -x "$SDKMAN" ]; then
            SDKMAN="$(command -v sdkmanager || true)"
          fi
          if [ -z "${SDKMAN:-}" ]; then
            echo "::error::sdkmanager not found on runner"; exit 1
          fi
          mkdir -p "$ANDROID_SDK_ROOT"
          yes | "$SDKMAN" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMAN" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platforms;${SDK_PLATFORM}" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle home (fixed key, shared with probe)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-home-8.9-v2

      - name: Build container APK
        working-directory: container
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ inputs.task || ':app:assembleDebug' }} --no-daemon --stacktrace

      # P1-2：Robolectric 单元测试（纯 JVM，不需要模拟器）
      # P1-2：纯 JUnit 单测（零下载，秒级）。
      # 失败时**必须让 job 变红**（不再 continue-on-error）——
      # p23 曾出现「19 个用例全失败，job 仍显示绿色通过」的误判。
      - name: Unit tests
        working-directory: container
        run: |
          set -o pipefail
          set +e
          ./gradlew :core:sandbox:testDebugUnitTest --no-daemon > /tmp/unit.log 2>&1
          rc=$?
          set -e
          echo "=== 任务/结果摘要 ==="
          grep -E "^> Task :core:sandbox:test|FAILED|BUILD |tests? completed|error:" /tmp/unit.log | head -n 40 || echo "none"
          echo "=== 失败行（仅错误摘要）==="
          grep -E "FAILED|AssertionError|Caused by:|Exception|error:" /tmp/unit.log | head -n 20 || echo "none"
          echo "=== 末尾 15 行 ==="
          tail -n 15 /tmp/unit.log
          exit $rc

      # 测试报告：JUnit XML -> GitHub check run + job summary，直接在 Actions 页面看，
      # 不需要下载 artifact。
      #
      # 用 mikepenz/action-junit-report 而不是 dorny/test-reporter：
      # 后者需要在一个 git 仓库根目录运行（它执行 `git ls-files`），
      # 而本 workflow 用 `actions/checkout` 的 `path: container` 把仓库检到子目录，
      # 根目录没有 .git -> p25 报 "fatal: not a git repository"。
      # 本 action 纯解析 XML，不依赖 git。
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'container/core/sandbox/build/test-results/testDebugUnitTest/*.xml'
          check_name: Unit Test Results
          fail_on_failure: true        # 有失败 -> check 标红且步骤失败
          require_tests: false         # 没跑测试不算失败
          detailed_summary: true       # 在 job summary 里列出每个用例
          job_summary: true
          include_passed: true

      - name: Collect outputs
        if: always()
        run: |
          echo "=== APK ==="
          find container -name '*.apk' -exec ls -lh {} \; 2>/dev/null || echo "no apk"
          echo "=== native libs ==="
          find container -name '*.so' -exec ls -lh {} \; 2>/dev/null | head -n 20 || true

      # 产物体面化：container-<repo>-<sha>.apk，artifact 内不带多级目录
      - name: Stage artifact
        id: stage
        run: |
          set -euo pipefail
          SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          mkdir -p out
          SRC="$(find container -path '*/build/outputs/apk/debug/*.apk' | head -n1 || true)"
          if [ -n "${SRC:-}" ]; then
            cp "$SRC" "out/container-shitjumpingvm-${SHA}.apk"
            # 产物约定：文件名必须 .apk 结尾
            DST="out/container-shitjumpingvm-${SHA}.apk"
            case "$DST" in
              *.apk) ;;
              *) echo "::error::artifact must end with .apk: $DST"; exit 1 ;;
            esac
            echo "path=out/container-shitjumpingvm-${SHA}.apk" >> "$GITHUB_OUTPUT"
            ls -lh out
          else
            echo "::warning::no apk produced"
          fi

      # 不使用 upload-artifact（强制 zip）；直接挂 Release asset。
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK (latest)
          body: "container APK built from ${{ github.sha }}"
          prerelease: true
          overwrite_files: true
          files: out/*.apk

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-build-reports
          path: |
            container/**/build/reports/**
            container/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
